# CI runs on https://gitlab.ariverse.ca using the ubuntu-latest Linux runner.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

stages: [test]

default:
  image: catthehacker/ubuntu:act-latest
  tags: [ubuntu-latest]

web:
  stage: test
  timeout: 30m
  interruptible: true
  script:
    - npm ci
    - npm run build
