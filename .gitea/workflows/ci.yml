# Self-hosted CI on https://git.ariverse.ca (Gitea Actions). Gitea pull-mirrors this
# repository from GitHub and runs this workflow on every branch push; GitHub ignores
# .gitea/, so it uses no GitHub Actions minutes. Check results with `gitea-ci wait`.
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  web:
    name: Web (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
